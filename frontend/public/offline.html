<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Spotify Album Organizer</title>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 50px; }
    h1 { color: #22c55e; }
    button { background: #22c55e; color: #000; padding: 10px 20px; border: none; border-radius: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Offline Mode</h1>
  <p>You're offline. Connect to internet to fetch or sync your liked Spotify albums.</p>
  <p>If you have cached data, try filters or shuffle offline.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
